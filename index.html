.rdc{padding:24px 28px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:var(--ink);overflow:auto;flex:1;min-height:0;width:100%;box-sizing:border-box}
.rdh{display:flex;gap:16px;align-items:flex-start}
.rdh img{width:84px;aspect-ratio:2/3;object-fit:cover;border-radius:3px;box-shadow:0 3px 10px rgba(0,0,0,.35);flex:none}
.rdh b{display:block;font-size:1.15em;line-height:1.3}
.rdx{max-width:62ch;font-size:1em;line-height:1.65;user-select:text;-webkit-user-select:text}
.rdx p{margin:0 0 12px}
.rdc span,.rdc p{color:var(--mut2);margin:0}
.rdc .btn{margin-top:6px;text-decoration:none;display:inline-block}
.rdrb{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--tb);font-size:.8em;color:var(--mut2)}
.rdrb a{color:var(--acc);white-space:nowrap}
.rdrf{flex:1;min-height:0;width:100%;border:0;background:#fff;display:block}
.win.rz>.rdr,.win.max>.rdr{flex:1;min-height:0;height:auto}
.ni .bkt{display:inline-block;margin-top:3px;background:var(--red2);color:#fff;font-style:normal;font-size:.68em;padding:2px 8px;border-radius:10px}
.ni.s .bkt{background:#fff;color:var(--red2)}

/* macOS 27 Golden Gate: vetro uniforme */
:root{--lg:.5;--gb:calc(14px + (1 - var(--lg))*26px);--gp:calc(30% + var(--lg)*70%);--wr:16px}
.win{background:var(--win);background:color-mix(in srgb,var(--win) var(--gp),transparent);-webkit-backdrop-filter:blur(var(--gb)) saturate(1.5);backdrop-filter:blur(var(--gb)) saturate(1.5);border-radius:var(--wr);border:1px solid var(--bd);box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.14)}
.win.act{box-shadow:0 0 0 .5px rgba(0,0,0,.35),0 28px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.win:not(.act) .tb{opacity:.92}
.win.max{border-radius:0}
.tb{background:var(--tb);background:color-mix(in srgb,var(--tb) var(--gp),transparent);height:36px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.fside{background:var(--hov);background:color-mix(in srgb,var(--hov) calc(var(--lg)*70%),transparent);-webkit-backdrop-filter:blur(var(--gb));backdrop-filter:blur(var(--gb));padding:10px 8px 12px}
.fsi{border-radius:9px;padding:5px 9px}
.fsi.on{background:color-mix(in srgb,var(--red) 22%,transparent);font-weight:600}
.fbar{padding:7px 12px;background:color-mix(in srgb,var(--tb) var(--gp),transparent)}
.fbar button,.pvb button{height:28px;min-width:34px;border-radius:14px;background:color-mix(in srgb,var(--ctl) var(--gp),transparent);border:1px solid color-mix(in srgb,var(--bd) 60%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.vs{border-radius:14px}
.fbar .vs button{height:28px;border-radius:0}
#mn,#spb,#stk{border-radius:12px;-webkit-backdrop-filter:blur(var(--gb)) saturate(1.5);backdrop-filter:blur(var(--gb)) saturate(1.5)}
#mn{background:var(--menu);background:color-mix(in srgb,var(--menu) calc(var(--lg)*100%),transparent)}
#dockbg{border-radius:28px;background:var(--dockbg);-webkit-backdrop-filter:blur(calc(var(--gb) + 10px)) saturate(1.9) brightness(1.05);backdrop-filter:blur(calc(var(--gb) + 10px)) saturate(1.9) brightness(1.05);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.08),0 12px 34px rgba(0,0,0,.3)}
html[data-theme=light] #dockbg{border-color:rgba(255,255,255,.75)}
html[data-theme=light]{--dockbg:rgba(255,255,255,.42)}
html:not([data-theme=light]){--dockbg:rgba(255,255,255,.14)}
html[data-contrast=high] #dockbg{border-color:var(--bd2)}
#dockwrap.sc #dock{border-radius:28px}
#dock .dk{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -6px 10px rgba(0,0,0,.18),0 3px 8px rgba(0,0,0,.35)}
#dock .dk.ap,#dock .dk.tr{box-shadow:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}
html:has(.win.max) #bar{background:var(--tb);-webkit-backdrop-filter:none;backdrop-filter:none}
.lgn{margin:6px 0 0;font-size:.8em;color:var(--mut)}
html[data-contrast=high] .win,html[data-contrast=high] .fside,html[data-contrast=high] #dockbg{-webkit-backdrop-filter:none;backdrop-filter:none}
html[data-contrast=high] .win{border-radius:var(--wr)}

/* Spotlight: Liquid Glass */
#sp{background:rgba(0,0,0,.22)}
#spb{background:var(--menu);background:color-mix(in srgb,var(--menu) var(--gp),transparent);-webkit-backdrop-filter:blur(calc(var(--gb) + 8px)) saturate(1.7);backdrop-filter:blur(calc(var(--gb) + 8px)) saturate(1.7);border:1px solid color-mix(in srgb,var(--bd2) 70%,transparent);border-radius:28px;box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.06)}
#spb .in{padding:14px 22px;gap:12px}
#spb .in svg{width:22px;height:22px}
#spr{border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);padding:8px}
#spr .it{border-radius:16px;padding:9px 14px}
#spr .none{padding:18px}
html[data-contrast=high] #sp{-webkit-backdrop-filter:none;backdrop-filter:none}
html[data-contrast=high] #spb{-webkit-backdrop-filter:none;backdrop-filter:none}

/* pagina tipografica */
:root{--cor:#d9503a;--pgbg:#f2eee6}
html:not([data-theme=light]){--pgbg:#000}
#desk .ic{display:none!important}
#bg,#bgf{display:none}
#pg{position:fixed;inset:0;z-index:1;background:var(--pgbg);overflow:hidden}
#sph{position:absolute;inset:0;background:radial-gradient(circle 40vmin at 50% 52%,var(--cor) 0,var(--cor) 42%,rgba(217,80,58,0) 100%);pointer-events:none}
html.nosph #sph{display:none}
#pgt{position:absolute;inset:0;overflow:auto;padding:calc(28px + 3vh) 4vw 120px;scrollbar-width:none;font-family:"Times New Roman",Times,"Liberation Serif",serif;color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-image:radial-gradient(circle 40vmin at 50% 52%,#000 0,#000 34%,var(--cor) 78%)}
html.nosph #pgt{background-image:linear-gradient(var(--cor),var(--cor))}
html[data-contrast=high] #pgt{background-image:none;-webkit-text-fill-color:currentColor;color:#000}
html[data-contrast=high]:not([data-theme=light]) #pgt{color:#fff}
#pgt::-webkit-scrollbar{display:none}
.pgwm{position:relative;margin:0;font-weight:400;line-height:.8;letter-spacing:-.04em;font-size:clamp(84px,19vw,300px)}
.pgwm .pgw1,.pgwm .pgw2{display:block}
.pgwm .pgdr{position:absolute;left:min(62%,calc(100% - 3.2em));top:.1em;font-size:clamp(11px,1.3vw,18px);line-height:1.5;letter-spacing:0;font-style:normal}
.pgwm .pgdr i{display:inline-block;font-style:normal;margin-right:.9em}
.pgwm .pgdr i:nth-child(odd){position:relative;top:.5em}
.pgp{margin:clamp(24px,5vh,56px) 0 0;max-width:62ch;font-size:clamp(22px,3.1vw,44px);line-height:1.12;letter-spacing:-.015em}
.pgp.dim{opacity:.42;margin-top:clamp(40px,8vh,90px)}
.pgt2{all:unset;cursor:pointer;display:inline;font:inherit;color:inherit;-webkit-text-fill-color:inherit}
.pgt2:hover,.pgt2:focus-visible{font-style:italic}
.pgt2:focus-visible{text-decoration:underline;text-underline-offset:.12em}
.pgt2.on{font-style:italic}
.pgo{margin:clamp(24px,5vh,56px) 0 0;max-width:62ch;font-size:clamp(22px,3.1vw,44px);line-height:1.12;letter-spacing:-.015em}
.pgb{font-size:clamp(17px,1.9vw,26px);line-height:1.3;margin-top:.7em;letter-spacing:0}
.pgb p{margin:0 0 .7em}
.pgb img{max-width:min(100%,340px);max-height:240px;vertical-align:middle;cursor:zoom-in;border-radius:3px}
.pgb a{color:inherit;text-decoration:underline;-webkit-text-fill-color:inherit}
.pgk{display:flex;flex-wrap:wrap;gap:.25em .9em;margin-top:.6em;font-size:clamp(15px,1.5vw,20px)}
.pgl{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:.15em;font:inherit;-webkit-text-fill-color:inherit}
.pgl:hover,.pgl:focus-visible{font-style:italic}
@media(max-width:640px){.pgwm .pgdr{display:none}}
@media(max-width:640px){.frm{display:none!important}}

/* v2: niente struttura Mac */
:root{--cor:#c0412b;--sph:#e0583f;--corx:#b3391f}
html:not([data-theme=light]){--cor:#f24a32;--sph:#f24a32;--corx:#f56a54}
#mbs,#dockwrap,#ib,#stk{display:none!important}
#bar{height:56px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border:0;padding:0 4vw;color:var(--corx);overflow:visible;align-items:flex-start;padding-top:14px}
#bar .q,#clk{color:var(--corx)}
#lg{all:unset;cursor:pointer;display:block;width:68px;color:var(--cor);flex:none}
#lg svg{display:block;width:100%;height:auto}
#lg:focus-visible,#nv button:focus-visible,.pgx:focus-visible,.pga:focus-visible,.pgt2:focus-visible{outline:2px solid var(--corx);outline-offset:3px}
#nv{display:flex;gap:18px;margin-left:28px;align-self:center;font-family:"Times New Roman",Times,"Liberation Serif",serif;font-size:calc(17px*var(--fz))}
#nv button{all:unset;cursor:pointer;color:var(--corx)}
#nv button:hover{font-style:italic}
#bar .rr{align-self:center}
#sph{background:radial-gradient(circle 40vmin at 50% 52%,var(--sph) 0,var(--sph) 42%,transparent 100%)}
#pgt{padding:86px 4vw 90px;background-image:radial-gradient(circle 40vmin at 50% 52%,#000 0,#000 34%,var(--cor) 78%)}
html.nosph #pgt{background-image:linear-gradient(var(--cor),var(--cor))}
html[data-contrast=high] #pgt{background-image:none}
.pgp,.pgo{margin:0;max-width:60ch;font-size:clamp(17px,1.7vw,24px);line-height:1.22}
.pgp.dim{margin-top:clamp(28px,5vh,50px)}
.pgo{margin-bottom:0}
.pgb{display:flow-root;font-size:clamp(15px,1.3vw,18px);line-height:1.4;margin-top:.8em}
.pgb p{margin:0 0 .8em}
.pga{all:unset;cursor:zoom-in;float:left;margin:4px 20px 8px 0;shape-margin:14px;display:block}
.pga.r{float:right;margin:4px 0 8px 20px}
.pga.img img{display:block;width:clamp(120px,17vw,210px);height:auto;max-height:none;cursor:zoom-in}
.pga.pdf{width:clamp(110px,12vw,150px)}
.pga.pdf iframe{display:block;width:100%;height:clamp(150px,17vw,200px);border:1px solid var(--cor);background:#fff;pointer-events:none}
.pga.pdf .cap{display:block;font-size:12px;margin-top:4px;line-height:1.2}
.pgk{margin-top:.8em}
#pgp{position:fixed;top:64px;right:16px;bottom:16px;width:min(46vw,640px);z-index:6;background:var(--pgbg);border:1px solid var(--cor);border-radius:10px;display:flex;flex-direction:column;color:var(--corx);font-family:"Times New Roman",Times,"Liberation Serif",serif;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.pgh{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--cor);font-size:16px}
.pgn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgx{all:unset;cursor:pointer;padding:2px 8px;font-size:17px;line-height:1}
.pgo2{color:inherit;font-size:14px}
.pgv{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center}
.pgv iframe{width:100%;height:100%;border:0;background:#fff}
.pgv img{max-width:100%;max-height:100%;object-fit:contain}
@media(min-width:901px){#pgt.wp .pgp,#pgt.wp .pgo{max-width:min(60ch,calc(100vw - min(46vw,640px) - 10vw))}}
@media(max-width:900px){#pgp{left:8px;right:8px;top:auto;width:auto;height:58vh;bottom:8px}}
@media(max-width:640px){#nv{margin-left:14px;gap:12px}#bar .q{padding:0 3px}}
