:root{--ac:#ff371b;--acx:#d4280d;--ink:#111;--bg:#fff;--ln:#e6e3df;--fs:15px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:var(--fs);line-height:1.25;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:var(--acx)}
:focus-visible{outline:2px solid var(--acx);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::selection{background:var(--ac);color:#000}

#top{position:fixed;left:0;right:0;top:0;height:46px;z-index:50;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:0 18px;background:linear-gradient(#fff 70%,rgba(255,255,255,0));pointer-events:none}
#top>*{pointer-events:auto}
#me{margin:0;color:var(--acx);font-weight:600;font-size:15px;padding:0 0 8px;white-space:nowrap}
#tabs{display:flex;gap:2px;flex:1;min-width:0;overflow:hidden;align-items:flex-end}
.tb{max-width:210px;min-width:60px;flex:0 1 auto;padding:6px 12px 7px;border:1px solid var(--ln);border-bottom:0;border-radius:0;background:#fafaf8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#444}
.tb sup{font-size:.62em;margin-right:3px}
.tb.on{background:#fff;color:var(--ink);border-color:var(--ac);border-bottom:2px solid #fff;position:relative;top:1px}
#vw{display:flex;gap:16px;padding-bottom:8px;white-space:nowrap}
#vw button{color:var(--acx)}
#vw button[aria-pressed=true]{text-decoration:underline;text-underline-offset:4px}
#bk{display:none;color:var(--acx);padding:0 0 8px}

#flt{flex:1;min-width:0;display:flex;align-items:flex-end;padding:0 0 8px 6px;font-size:14px;white-space:nowrap}
#flt ul{margin:0;padding:0;display:flex;gap:20px}
#flt li{list-style:none}
#flt .gb{display:block;padding:0;line-height:1.25}
#flt .gb[aria-pressed=true]{color:var(--acx);font-weight:600}
#flt .gb:hover{color:var(--acx)}
#tabs{display:none}
#cvs{position:fixed;left:0;right:0;top:46px;bottom:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#ddd transparent}
#cv{position:relative;min-height:100%}
#thr{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:5}
#thr path{fill:none;stroke:var(--ac);stroke-width:1;stroke-dasharray:2 3}

.ow{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.ow2{position:absolute;left:0;top:0;width:0;height:0}
.ob{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:var(--w);translate:-50% -50%;transform:rotate(var(--r));opacity:var(--o,1);transition:opacity .35s,filter .35s;text-align:center}
#cv:not(.ls) .ob .cp{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#cvs:has(#cv:not(.ls)){overflow:hidden}
.ic{display:block;width:calc(var(--s) * 1.16);height:calc(var(--s) * 1.16);flex:none;background:var(--ink);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;transition:background-color .25s,transform .7s cubic-bezier(.34,1.45,.64,1)}
.ob svg{width:var(--s);height:var(--s);overflow:visible;fill:var(--ink);stroke:var(--ink);stroke-width:0;transition:fill .25s,stroke .25s,transform .7s cubic-bezier(.34,1.45,.64,1)}
.ob svg .st{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.ob .cp{font-size:14px;line-height:1.12;max-width:var(--w);transform:rotate(calc(var(--r) * -1))}
.ob .cp sup{font-size:.65em;margin-right:2px}
.ob:hover .ic,.ob:focus-visible .ic{transform:scale(1.3)}
.ob.away{opacity:0;transition:none}
.ob:hover .cp,.ob:focus-visible .cp{text-decoration:underline;text-underline-offset:3px}
.ob.dim{opacity:calc(var(--o,1)*.12);filter:grayscale(1);pointer-events:none}
.ob.hl .ic,.ob.vis .ic,.ob.open .ic{background:var(--ac)}
.ob.vis .cp,.ob.open .cp{color:var(--acx)}
.in .ow{animation:pop .9s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes pop{from{opacity:0}}

#cv.ls{padding:22px 24px 60px}
#cv.ls .ow,#cv.ls .ow2{position:static;width:auto;height:auto;will-change:auto}
#cv.ls .ob{position:static;transform:none;translate:none;flex-direction:row;align-items:center;gap:14px;width:auto;margin:0 0 4px;text-align:left}
#cv.ls .ob .ic{width:26px;height:26px}
#cv.ls .ob .cp{transform:none;max-width:none;font-size:16px}
#cv.ls .gh{margin:22px 0 8px;font-weight:600}
#cv.ls #thr{display:none}

.pn{position:absolute;z-index:10;width:min(460px,calc(100vw - 40px));max-height:78vh;display:flex;flex-direction:column;color:#000;border-radius:0;overflow:hidden;
 background:linear-gradient(155deg,rgba(255,255,255,.9),rgba(255,255,255,.68) 52%,rgba(255,255,255,.84));
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
 border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.5),inset 0 0 24px rgba(255,255,255,.55),0 16px 44px rgba(0,0,0,.13),0 1px 4px rgba(0,0,0,.1);
 transition:left .8s cubic-bezier(.16,.84,.24,1)}
.pn.dg{transition:none}
.pn::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 55% at 18% -8%,rgba(255,255,255,.95),transparent 58%)}
.pn.vwr{width:min(430px,calc(100vw - 40px));max-height:78vh}
.pn header{position:relative;display:flex;gap:14px;justify-content:space-between;align-items:baseline;padding:10px 16px;border-bottom:1px solid rgba(0,0,0,.1);cursor:grab;touch-action:none;user-select:none}
.pn header:active{cursor:grabbing}
.pn h1{margin:0;font-size:1em;font-weight:600;color:inherit;line-height:1.15}
.pn h1 sup{font-size:.65em;margin-right:3px;font-style:normal}
.pn .x{color:inherit;text-decoration:underline;text-underline-offset:3px;white-space:nowrap;font-size:14px}
.pn .bd{position:relative;padding:14px 18px 18px;overflow:auto;overscroll-behavior:contain}
.pn .bd>*:first-child{margin-top:0}
.pn .bd p{margin:0 0 .8em}
.pn a{color:var(--acx);text-decoration:underline;text-underline-offset:3px}
.pn .bd img{max-width:100%;height:auto;display:block}
.pn .bd figure{margin:0}
.pn .bd .th{display:inline-block;margin:0 10px 10px 0;vertical-align:top;border:1px solid rgba(0,0,0,.12);border-radius:0;overflow:hidden;background:rgba(255,255,255,.85);padding:0;cursor:zoom-in;line-height:0;text-decoration:none}
.pn .bd .th img{width:auto;height:78px;max-width:118px;object-fit:cover}
.pn .bd .pf{color:#000;display:inline-block;margin:0 10px 10px 0;padding:6px 12px;border:1px solid currentColor;border-radius:999px;line-height:1.2;text-decoration:none}
.pn .bd .pf:hover{background:rgba(0,0,0,.06)}
.pn .bd iframe{border:0;width:100%}
.pn .vb{position:relative;padding:12px;display:flex;overflow:auto}
.pn .vb img{max-width:100%;max-height:70vh;margin:auto;display:block}
.pn .vb iframe{width:100%;height:min(60vh,520px);border:0;background:#fff}
#msg{position:fixed;left:214px;right:0;top:50%;text-align:center;font-style:italic;color:var(--acx);pointer-events:none}

@media(max-width:760px){
 body{overflow:hidden}
 #flt{position:fixed;left:0;right:0;top:46px;bottom:auto;width:auto;height:46px;padding:0 12px;display:flex;align-items:center;gap:14px;overflow-x:auto;overflow-y:hidden;background:#fff;border-bottom:1px solid var(--ln)}
 #flt h2{display:none}
 #flt ul{display:flex;gap:16px;white-space:nowrap}
 #flt .gb{padding:2px 0;width:auto}
 #cvs{left:0;top:92px}
 #top{padding:0 12px}
 #tabs{display:none}
 #msg{left:0}
 .pn{position:fixed!important;left:8px!important;right:8px;top:100px!important;bottom:8px;width:auto;max-height:none;z-index:60}
 .pn.hid{display:none}
 .pn .bd{flex:1}
 #thr{display:none}
 .has-pn #bk{display:block}
 .has-pn #me{display:none}
}
@media(max-width:760px){.ob .cp{font-size:12px}}
@media(prefers-reduced-motion:reduce){.ob,.ow2,.in .ow{animation:none!important}.ob .ic{transition:none}}

.pn.out{opacity:0;transition:opacity .4s;pointer-events:none}
#mr{position:fixed;left:0;right:0;top:0;bottom:0;z-index:300;pointer-events:none;opacity:0;transition:opacity 1s cubic-bezier(.2,.7,.2,1);
 background:linear-gradient(115deg,rgba(255,255,255,.16),rgba(232,232,236,.08) 40%,rgba(255,255,255,.2) 64%,rgba(226,226,230,.1));
}
#mr::after{display:none;content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 64%);background-size:240% 100%;animation:sh 9s ease-in-out infinite alternate;opacity:.35}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.has-pn #mr{opacity:1;pointer-events:auto}
.has-pn .ob{pointer-events:none}
@media(prefers-reduced-motion:reduce){.pn{animation:none}#mr::after{animation:none}}

.cb{position:absolute;z-index:10;width:210px;height:210px;perspective:760px;cursor:grab;touch-action:none;user-select:none;transition:opacity .5s}
.cb:active{cursor:grabbing}.cb.hid{opacity:0;pointer-events:none}.cb.fl{pointer-events:none}
.cb .bg{position:absolute;inset:0;overflow:hidden;background:linear-gradient(155deg,rgba(255,255,255,.97),rgba(255,255,255,.93) 52%,rgba(255,255,255,.96));border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,0 14px 36px rgba(0,0,0,.12)}
.cf{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.cr{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.cl{position:absolute;left:-81px;top:-81px;width:162px;height:162px;background:#e6310f;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;transition:background-color .8s}
.cl.o{background:#fb4a29}
.cl.k{background:#9a1904}
.cl.f0{background:var(--ac)}
.cl.f{background:linear-gradient(135deg,#ff9277,#ff371b 40%,#bd2108);transition:opacity .8s}
